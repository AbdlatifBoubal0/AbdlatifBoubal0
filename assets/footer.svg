<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Thanks for stopping by" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0820"/>
      <stop offset="1" stop-color="#1C1040"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0A850"/>
      <stop offset="0.5" stop-color="#E237B9"/>
      <stop offset="1" stop-color="#268AE2"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C28AC"/>
      <stop offset="0.3" stop-color="#9E00D1"/>
      <stop offset="0.55" stop-color="#E237B9"/>
      <stop offset="0.8" stop-color="#F0A850"/>
      <stop offset="1" stop-color="#268AE2"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="140" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="140" fill="url(#bg)"/>
    <text x="600" y="62" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="26" font-weight="700" fill="url(#title)">Thanks for stopping by</text>
    <text x="600" y="90" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="14" fill="#B8A9E8"> let's build something great together</text>
    <path fill="url(#wave)" opacity="0.5" d="M0,108 Q150,90 300,108 T600,108 T900,108 T1200,108 T1500,108 T1800,108 T2100,108 T2400,108 L2400,140 L0,140 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#wave)" opacity="0.85" d="M0,124 Q150,108 300,124 T600,124 T900,124 T1200,124 T1500,124 T1800,124 T2100,124 T2400,124 L2400,140 L0,140 Z">
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
