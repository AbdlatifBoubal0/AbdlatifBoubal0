<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="BOUBAL Abdlatif - Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0820"/>
      <stop offset="1" stop-color="#1C1040"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0A850"/>
      <stop offset="0.5" stop-color="#E237B9"/>
      <stop offset="1" stop-color="#268AE2"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C28AC"/>
      <stop offset="0.3" stop-color="#9E00D1"/>
      <stop offset="0.55" stop-color="#E237B9"/>
      <stop offset="0.8" stop-color="#F0A850"/>
      <stop offset="1" stop-color="#268AE2"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- twinkling dots -->
    <g fill="#FFFFFF">
      <circle cx="90" cy="50" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="120" r="1.5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="40" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="55" r="1.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="130" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="45" r="1.5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- floating code glyphs -->
    <g font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-weight="700" font-size="34">
      <text x="110" y="150" fill="#268AE2" opacity="0.35">&lt;/&gt;
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="1010" y="110" fill="#F0A850" opacity="0.35">{ }
        <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="200" y="60" fill="#E237B9" opacity="0.3">=&gt;
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="930" y="200" fill="#9E00D1" opacity="0.4">;
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- title -->
    <g text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,monospace">
      <text x="600" y="125" font-size="60" font-weight="700" fill="url(#title)">BOUBAL Abdlatif
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      </text>
      <text x="600" y="172" font-size="23" fill="#E8E3FF" letter-spacing="7">SOFTWARE ENGINEER
        <animate attributeName="opacity" from="0" to="1" dur="1.8s" fill="freeze"/>
      </text>
      <text x="600" y="203" font-size="16" fill="#B8A9E8"> building clean, useful and scalable software</text>
    </g>

    <!-- waves (period 600, translate by 600 for a seamless loop) -->
    <g>
      <path fill="url(#wave)" opacity="0.55" d="M0,236 Q150,206 300,236 T600,236 T900,236 T1200,236 T1500,236 T1800,236 T2100,236 T2400,236 L2400,300 L0,300 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="14s" repeatCount="indefinite"/>
      </path>
      <path fill="url(#wave)" opacity="0.4" d="M0,254 Q150,278 300,254 T600,254 T900,254 T1200,254 T1500,254 T1800,254 T2100,254 T2400,254 L2400,300 L0,300 Z">
        <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="20s" repeatCount="indefinite"/>
      </path>
      <path fill="url(#wave)" opacity="0.85" d="M0,274 Q150,252 300,274 T600,274 T900,274 T1200,274 T1500,274 T1800,274 T2100,274 T2400,274 L2400,300 L0,300 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
