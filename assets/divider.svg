<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0A850"/>
      <stop offset="0.25" stop-color="#E237B9"/>
      <stop offset="0.5" stop-color="#9E00D1"/>
      <stop offset="0.75" stop-color="#4C28AC"/>
      <stop offset="1" stop-color="#268AE2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="8" rx="4"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="8" fill="url(#g)"/>
    <rect y="0" width="240" height="8" fill="url(#shine)">
      <animate attributeName="x" from="-240" to="1200" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
